<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News — 12 Guys 1 Cup</title>
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <nav id="site-nav" class="site-nav"></nav>

  <main class="wrap">
    <section class="section">
      <div class="section-head">
        <h2>The Wire</h2>
        <span class="meta">Fastest headlines • Multi-source RSS</span>
      </div>
      <div id="wire-list"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Trending on Sleeper</h2>
        <span class="meta">Most-added across every Sleeper league</span>
      </div>
      <div id="trending-list"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Feature stories</h2>
        <span class="meta">Longer reads from ESPN</span>
      </div>
      <div id="news-filter" class="controls"></div>
      <div id="news-list"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/sleeper.js"></script>
  <script src="assets/js/news.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages.js"></script>
  <script>
    UI.renderChrome("news.html");
    Pages.renderNews();
  </script>
</body>
</html>
