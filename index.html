<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12 Guys 1 Cup — Fantasy Football HQ</title>
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <nav id="site-nav" class="site-nav"></nav>

  <main class="wrap">
    <div id="hero"></div>

    <section class="section">
      <div class="section-head">
        <h2>Live ticker</h2>
        <span class="meta">This week's matchups &amp; scores</span>
      </div>
      <div id="home-matchups"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Standings snapshot</h2>
        <span class="meta">Full league</span>
      </div>
      <div id="home-standings"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Around the league</h2>
        <span class="meta">NFL news</span>
      </div>
      <div id="home-news"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/sleeper.js"></script>
  <script src="assets/js/news.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages.js"></script>
  <script>
    UI.renderChrome("index.html");
    Pages.renderHome();
  </script>
</body>
</html>
