name: Discord — Injury alerts

# Posts new + changed injury statuses to Discord #injuries channel.
# Runs hourly. Deduplicates via discord-state.json (per-player status tracking).

on:
  schedule:
    - cron: "10 * * * *"   # 10 min past the hour (after fantasypros feed refresh at :00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-injuries
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post injuries to Discord
        env:
          DISCORD_INJURIES_WEBHOOK: ${{ secrets.DISCORD_INJURIES_WEBHOOK }}
        run: node .github/scripts/discord-injuries.js

      - name: Commit state if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/discord-state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update Discord injury state [skip ci]"
          git push
