name: Update nflverse data

# Fetches nflverse data (weekly stats, snap counts, xFP, depth charts,
# schedules, play-by-play, waiver metrics) and commits to the repo.
#
# Schedule:
#   Tuesday 11am CST — main run after nflverse's Tuesday ingest completes
#   Thursday 10am CST — backup catch for late-Tuesday updates before TNF
#
# nflverse typically publishes updated Week N data by ~12pm ET Tuesday,
# so 11am CST (12pm ET) is the sweet spot: late enough for data to be
# fresh, early enough that we get the day started with new metrics.

on:
  schedule:
    # Tuesday 16:00 UTC = 11am CST (11am CDT during DST)
    - cron: "0 16 * * 2"
    # Thursday 15:00 UTC = 10am CST (10am CDT during DST) — backup
    - cron: "0 15 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nflverse
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install nfl_data_py pandas pyarrow requests

      - name: Fetch nflverse data
        run: python .github/scripts/fetch-nflverse.py

      - name: Commit + push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/nflverse/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update nflverse data [skip ci]"
          # Retry on concurrent push (up to 5 attempts)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Retry $i after concurrent push…"
            sleep 5
          done
          exit 1
