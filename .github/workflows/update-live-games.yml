name: Update live games (schedule + odds + weather)

# Fetches current week's NFL matchups, Vegas spreads/totals, and weather.
# Feeds the Start/Sit tool's game context (matchup, game script, weather multipliers).
#
# Runs every 2 hours 24/7 during NFL season.
# Spreads move throughout the week; closer to kickoff = more accurate lines.

on:
  schedule:
    - cron: "0 */2 * * *"    # every 2 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-live-games.yml"
      - ".github/scripts/fetch-live-games.js"

permissions:
  contents: write

concurrency:
  group: update-live-games
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live game data
        run: node .github/scripts/fetch-live-games.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/live-games.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update live game data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Retry $i…"
            sleep 5
          done
          exit 1
