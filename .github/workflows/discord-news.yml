name: Discord — News alerts

# Posts new wire + FantasyPros news items to the Discord #news channel.
# Deduplicates via discord-state.json.
#
# DISABLED — auto-schedule turned off because Readybot.io Premium now
# handles NFL news posting to Discord. Can still be run manually via
# workflow_dispatch. To re-enable auto-run, uncomment the schedule line.

on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-news
  cancel-in-progress: false   # queue instead of skip — don't miss news

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Post news to Discord
        env:
          DISCORD_NEWS_WEBHOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
        run: node .github/scripts/discord-news.js

      - name: Commit state if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/discord-state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update Discord news state [skip ci]"
          git push
