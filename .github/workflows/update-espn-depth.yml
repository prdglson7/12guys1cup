name: Update ESPN depth charts + injuries

# Fetches real-time depth charts and injury reports from ESPN's public API
# for all 32 NFL teams. Powers the Start/Sit depth chart injury overlay.
#
# Runs every 30 min — ESPN updates when coaches publish practice reports.

on:
  schedule:
    - cron: "*/30 * * * *"    # every 30 min
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-espn-depth.yml"
      - ".github/scripts/fetch-espn-depth.js"

permissions:
  contents: write

concurrency:
  group: update-espn-depth
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch ESPN depth charts + injuries
        run: node .github/scripts/fetch-espn-depth.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/espn-depth-charts.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update ESPN depth charts [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Retry $i…"
            sleep 5
          done
          exit 1
