name: Update FantasyPros feed

# Fetches NFL news + injuries from FantasyPros.
#
# API budget management:
#   Before 2026-09-07 00:00 UTC (draft season):
#     - Runs every 2 hours (12 runs/day × 2 endpoints = 24 calls/day)
#     - Draft Kit workflow uses the other 24 calls/day (48 total, under 50 limit)
#
#   After 2026-09-07 00:00 UTC (regular season):
#     - Runs every hour (24 runs/day × 2 endpoints = 48 calls/day)
#     - Draft Kit workflow has sunset, so all budget goes here for fastest news
#
# The workflow runs hourly all the time — it uses a date-check step to skip
# the odd-hour runs before sunset.

on:
  schedule:
    - cron: "0 * * * *"        # every hour on the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fantasypros.yml"

permissions:
  contents: write

concurrency:
  group: update-fantasypros
  cancel-in-progress: true

env:
  FP_BASE: "https://api.fantasypros.com/public/v2/json"
  FP_SEASON: "2026"
  SUNSET_DATE: "2026-09-07 00:00:00"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Decide whether to run this hour
        id: check
        run: |
          NOW_EPOCH=$(date -u +%s)
          SUNSET_EPOCH=$(date -u -d "${SUNSET_DATE}" +%s)
          HOUR=$(date -u +%H)
          NOW_HUMAN=$(date -u -Iseconds)
          echo "Now: ${NOW_HUMAN} (hour=${HOUR})"

          # Always run on manual dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — running."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Always run on push (config change)
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push trigger — running."
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$NOW_EPOCH" -ge "$SUNSET_EPOCH" ]; then
            echo "Post-sunset: running every hour."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            # Pre-sunset: only run on even hours (every 2 hours)
            if [ $((10#$HOUR % 2)) -eq 0 ]; then
              echo "Pre-sunset even hour: running."
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "Pre-sunset odd hour: skipping (2h cadence)."
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Fetch FantasyPros data
        if: steps.check.outputs.should_run == 'true'
        env:
          FP_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          set -e
          mkdir -p assets/data

          if [ -z "$FP_KEY" ]; then
            echo "::error::FANTASYPROS_API_KEY secret is not set."
            exit 1
          fi

          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          fetch_endpoint () {
            local URL="$1"
            local OUT="$2"
            local LABEL="$3"

            echo "→ $LABEL"
            echo "  URL: $URL"

            HTTP_CODE=$(curl -sS -o /tmp/fp.json -w "%{http_code}" \
              -H "x-api-key: $FP_KEY" \
              -H "Accept: application/json" \
              "$URL" || echo "000")

            echo "  HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::$LABEL returned HTTP $HTTP_CODE"
              head -c 300 /tmp/fp.json || true
              return 1
            fi

            if ! jq empty /tmp/fp.json 2>/dev/null; then
              echo "::warning::$LABEL returned non-JSON"
              head -c 300 /tmp/fp.json || true
              return 1
            fi

            jq --arg t "$TS" --arg u "$URL" \
              '. + {fetched_at: $t, source_url: $u}' \
              /tmp/fp.json > "$OUT"

            echo "  ✓ Wrote $OUT"
            return 0
          }

          # --- News ---
          NEWS_OK=0
          fetch_endpoint \
            "${FP_BASE}/nfl/news?limit=50" \
            "assets/data/fantasypros.json" \
            "News" && NEWS_OK=1

          # --- Injuries ---
          INJURIES_OK=0
          fetch_endpoint \
            "${FP_BASE}/nfl/injuries?year=${FP_SEASON}&include_probabilities=true" \
            "assets/data/fantasypros-injuries.json" \
            "Injuries" && INJURIES_OK=1

          if [ "$NEWS_OK" -ne 1 ] && [ "$INJURIES_OK" -ne 1 ]; then
            echo "::error::Both endpoints failed. Check API key and tier."
            exit 1
          fi

          echo "News:     $([ $NEWS_OK     -eq 1 ] && echo OK || echo FAILED)"
          echo "Injuries: $([ $INJURIES_OK -eq 1 ] && echo OK || echo FAILED)"

          if [ "$NEWS_OK" -eq 1 ]; then
            echo "News item count: $(jq '.items | length' assets/data/fantasypros.json)"
          fi
          if [ "$INJURIES_OK" -eq 1 ]; then
            echo "Injury count: $(jq '.injuries | length // .count // 0' assets/data/fantasypros-injuries.json)"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/fantasypros.json assets/data/fantasypros-injuries.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update FantasyPros feed [skip ci]"
          git push
