name: Compute weekly accuracy

# Evaluates the previous week's projections vs actuals.
# Runs automatically after "Update projections consensus" completes each Tuesday,
# ensuring the accuracy check always uses a fresh consensus file with the correct week.
#
# Chain sequence every Tuesday:
#   1. Update projections consensus (fetches fresh week from Sleeper)
#   2. This workflow auto-fires via workflow_run
#   3. Reads consensus.week, evaluates week-1 against actual game data
#
# Also has manual dispatch + weekly schedule as safety nets.

on:
  # Chain trigger: auto-fire after consensus workflow completes
  workflow_run:
    workflows: ["Update projections consensus"]
    types: [completed]
    branches: [main]
  # Backup schedule: Tuesday 10am CST (in case chain trigger misses)
  schedule:
    - cron: "0 15 * * 2"    # Tuesday 15:00 UTC = 10am CST
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-evaluate even if this week is already computed'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: compute-accuracy
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run chain-triggered jobs if the upstream workflow succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install nfl_data_py pandas pyarrow

      - name: Compute accuracy
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: python3 .github/scripts/compute-accuracy.py

      - name: Commit + push updated accuracy history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/accuracy-history.json
          if git diff --cached --quiet; then
            echo "No accuracy changes to commit."
            exit 0
          fi
          git commit -m "Update accuracy history [skip ci]"
          # Retry on concurrent push
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Retry $i after concurrent push…"
            sleep 5
          done
          exit 1
