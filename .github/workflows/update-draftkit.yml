name: Update Draft Kit

# Fetches consensus rankings + season projections + ADP from FantasyPros HOF.
# 11 API calls per run × 4 runs/day = 44 calls/day.
# HOF rate limit comfortably supports this.

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (00, 06, 12, 18 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-draftkit.yml"
      - ".github/scripts/fetch-draftkit.js"

permissions:
  contents: write

concurrency:
  group: update-draftkit
  cancel-in-progress: true

env:
  FP_SEASON: "2026"
  FP_SCORING: "PPR"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Draft Kit
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          FP_SEASON: ${{ env.FP_SEASON }}
          FP_SCORING: ${{ env.FP_SCORING }}
        run: node .github/scripts/fetch-draftkit.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build cheat sheet Excel
        run: |
          pip install openpyxl --quiet
          python .github/scripts/build-cheatsheet.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/draftkit.json assets/data/12guys1cup-cheat-sheet.xlsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Draft Kit + cheat sheet [skip ci]"
          git push
