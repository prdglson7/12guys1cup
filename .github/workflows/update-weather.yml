name: NFL Weather to Discord

# Posts NFL weather forecast to Discord.
# Runs every 30 minutes 24/7 — but dedupe (payload hash) prevents spam.
# When weather doesn't change, no Discord post happens.
# When it does change, it posts. That's the whole logic.
#
# Handles: Thu/Sun/Mon games, Fri/Sat late-season, international games,
# Wed openers, Christmas/Thanksgiving games — anything the NFL schedules.
#
# Manual trigger: set FORCE_POST=true to bypass dedupe.

on:
  schedule:
    - cron: "*/30 * * * *"    # every 30 min, every day
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post even if no changes'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-weather.yml"
      - ".github/scripts/discord-weather.js"
      - ".github/data/nfl-stadiums.json"

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post weather to Discord
        env:
          DISCORD_WEATHER_WEBHOOK: ${{ secrets.DISCORD_WEATHER_WEBHOOK }}
          FORCE_POST: ${{ github.event.inputs.force_post || 'false' }}
        run: node .github/scripts/discord-weather.js

      - name: Commit state file if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data/weather-state.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "Update weather state [skip ci]"
          git push
