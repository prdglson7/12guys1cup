name: Update Wire feed

# Fetches all RSS feeds server-side every 15 minutes and commits a merged
# assets/data/wire.json. The site reads that static file instead of hitting
# the allorigins.win CORS proxy on every page load — much faster.
#
# The feed list lives in assets/js/config.js — this workflow parses it.
# Add/remove sources there; both the client and this workflow pick it up.

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-wire.yml"
      - ".github/scripts/fetch-wire.js"
      - "assets/js/config.js"

permissions:
  contents: write

concurrency:
  group: update-wire
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install rss-parser
        run: npm install --no-save rss-parser@3.13.0

      - name: Fetch and merge feeds
        run: node .github/scripts/fetch-wire.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/wire.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # Include item count in commit message so history is scannable
          COUNT=$(node -e "console.log(require('./assets/data/wire.json').total_items)")
          git commit -m "Update wire: ${COUNT} items [skip ci]"
          git push
